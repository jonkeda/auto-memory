name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        run: pytest src/ -q

  dotnet:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: net/global.json
      - name: Verify version parity
        shell: pwsh
        run: ./net/tests/verify_version_parity.ps1
      - run: dotnet build net/AutoMemory.sln -c Release
      - run: dotnet test  net/AutoMemory.sln -c Release --no-build

  parity:
    needs: [test, dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: net/global.json
      - name: Install Python package
        run: pip install -e .
      - name: Publish .NET CLI
        run: dotnet publish net/src/AutoMemory.Cli -c Release -r linux-x64
      - name: Seed fixture database
        run: python net/tests/Parity/seed.py /tmp/fixture.sqlite
      - name: Run parity tests
        run: dotnet test net/tests/AutoMemory.Tests --filter Category=Parity -c Release
